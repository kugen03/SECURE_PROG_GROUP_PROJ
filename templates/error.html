{% extends "base.html" %}
{% block title %} — Error {{ code }}{% endblock %}
{% block content %}
<div class="card narrow" style="text-align:center">
  <h1 style="font-size:3rem;margin-bottom:0">{{ code }}</h1>
  <p class="muted">{{ message }}</p>
  <a class="btn" href="{{ url_for('dashboard') if user else url_for('login') }}">← Go back</a>
</div>
{% endblock %}
